name: Build Custom 1.12.3

on:
  push:
    branches:
      - custom-1.12.3-no-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-32" "build-tools;36.0.0" "ndk;26.2.11394342"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify output
        run: |
          test -f app/build/outputs/apk/release/Go_1.12.3_arm64-v8a_release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtGO-1.12.3-custom
          path: app/build/outputs/apk/release/Go_1.12.3_arm64-v8a_release.apk
          if-no-files-found: error
